<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="400" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  </defs>

  <!-- driver -->
  <rect x="24" y="168" width="128" height="64" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="88" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">run.mjs</text>
  <text x="88" y="216" text-anchor="middle" font-size="12" fill="#4b5563">ramps each round</text>
  <line x1="152" y1="200" x2="206" y2="200" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- parent -->
  <rect x="210" y="40" width="250" height="320" rx="14" fill="#fff7ed" stroke="#f6821f" stroke-width="2"/>
  <text x="335" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Lab</text>
  <text x="335" y="92" text-anchor="middle" font-size="12" fill="#4b5563">one parent Durable Object</text>
  <rect x="240" y="112" width="190" height="52" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="335" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">its own SQLite</text>
  <text x="335" y="152" text-anchor="middle" font-size="12" fill="#4b5563">which children exist</text>
  <rect x="240" y="180" width="190" height="52" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="335" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">ctx.facets.get(name)</text>
  <text x="335" y="220" text-anchor="middle" font-size="12" fill="#4b5563">load · call · abort · delete</text>
  <rect x="240" y="248" width="190" height="52" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="335" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">LOADER.get(id)</text>
  <text x="335" y="288" text-anchor="middle" font-size="12" fill="#4b5563">child code, no network</text>
  <text x="335" y="336" text-anchor="middle" font-size="12" fill="#9a3412">Ledger DO caps unique Worker IDs</text>

  <!-- children -->
  <line x1="460" y1="200" x2="530" y2="200" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)"/>
  <g font-size="11" fill="#1f2937" text-anchor="middle">
    <g transform="translate(540,52)">
      <rect width="92" height="58" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="46" y="25" font-weight="600">child</text><text x="46" y="42" fill="#4b5563">own SQLite</text>
    </g>
    <g transform="translate(644,52)">
      <rect width="92" height="58" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="46" y="25" font-weight="600">child</text><text x="46" y="42" fill="#4b5563">own SQLite</text>
    </g>
    <g transform="translate(748,52)">
      <rect width="92" height="58" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="46" y="25" font-weight="600">child</text><text x="46" y="42" fill="#4b5563">own SQLite</text>
    </g>
    <g transform="translate(540,128)">
      <rect width="92" height="58" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="46" y="25" font-weight="600">child</text><text x="46" y="42" fill="#4b5563">own SQLite</text>
    </g>
    <g transform="translate(644,128)">
      <rect width="92" height="58" rx="8" fill="#fef2f2" stroke="#f87171"/><text x="46" y="25" font-weight="600">hostile</text><text x="46" y="42" fill="#4b5563">loop · alloc · hang</text>
    </g>
    <g transform="translate(748,128)">
      <rect width="92" height="58" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="46" y="25" font-weight="600">child</text><text x="46" y="42" fill="#4b5563">own SQLite</text>
    </g>
    <g transform="translate(540,204)">
      <rect width="92" height="58" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="46" y="25" font-weight="600">child</text><text x="46" y="42" fill="#4b5563">own SQLite</text>
    </g>
    <g transform="translate(644,204)">
      <rect width="92" height="58" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="46" y="25" font-weight="600">child</text><text x="46" y="42" fill="#4b5563">nested ×3</text>
    </g>
    <g transform="translate(748,204)">
      <rect width="92" height="58" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="46" y="25" font-weight="600">child</text><text x="46" y="42" fill="#4b5563">own SQLite</text>
    </g>
  </g>
  <text x="690" y="300" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">… up to 5,000</text>
  <text x="690" y="324" text-anchor="middle" font-size="12" fill="#4b5563">facets of one parent, each a Durable Object</text>
  <text x="690" y="342" text-anchor="middle" font-size="12" fill="#4b5563">running code the parent loaded at runtime</text>
</svg>
